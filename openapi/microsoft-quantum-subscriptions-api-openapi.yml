          x-ms-mutability:
          - read
          - create
        outputDataUri:
          type: string
          description: The output blob uri. When a job finishes successfully, results will be uploaded to this blob.
          x-ms-mutability:
          - read
          - create
        outputDataFormat:
          type: string
          description: The format of the output data.
